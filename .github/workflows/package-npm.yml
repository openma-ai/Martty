name: Package and publish npm

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unix
            runner: ubuntu-24.04
          - name: windows
            runner: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - uses: pnpm/action-setup@v6
        if: runner.os != 'Windows'
        with:
          version: "10.2.0"
      - run: rustup update stable
      - run: rustup default stable
      - name: Verify release tag matches package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-tag.mjs "${{ github.ref_name }}" npm/package.json Cargo.toml
      - name: Run Rust tests
        if: runner.os != 'Windows'
        run: cargo test --locked
      - name: Check Rust tests on Windows
        if: runner.os == 'Windows'
        run: cargo check --locked --tests
      - name: Install Node test dependencies
        if: runner.os != 'Windows'
        run: npm ci --prefix npm --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Run Node tests
        if: runner.os != 'Windows'
        run: npm test --prefix npm

  native:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-15
            rust-target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
            binary: target/aarch64-apple-darwin/release/dsh-tui
          - name: darwin-x64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
            platform: darwin
            arch: x64
            binary: target/x86_64-apple-darwin/release/dsh-tui
          - name: linux-x64
            runner: ubuntu-24.04
            rust-target: x86_64-unknown-linux-musl
            platform: linux
            arch: x64
            smoke-platform: linux/amd64
            binary: target/x86_64-unknown-linux-musl/release/dsh-tui
          - name: linux-arm64
            runner: ubuntu-24.04
            rust-target: aarch64-unknown-linux-musl
            platform: linux
            arch: arm64
            smoke-platform: linux/arm64
            binary: target/aarch64-unknown-linux-musl/release/dsh-tui
          - name: win32-x64
            runner: windows-2025
            rust-target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
            binary: target/x86_64-pc-windows-msvc/release/dsh-tui.exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: rustup update stable
      - run: rustup default stable
      - name: Install musl linker
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: rustup target add ${{ matrix.rust-target }}
      - name: Build
        # The aarch64 musl target links fully self-contained from the rust
        # sysroot (bundled crt objects + musl libc.a), and the only cc
        # dependency (iana-time-zone-haiku) is Haiku-only, so no external
        # C toolchain is needed: point the arm64 link at the toolchain's
        # bundled rust-lld. Other matrix entries build their own targets.
        # shell: bash keeps the POSIX script valid on the Windows runner.
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            HOST="$(rustc -vV | sed -n 's/^host: //p')"
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$(rustc --print sysroot)/lib/rustlib/$HOST/bin/rust-lld"
          fi
          cargo build --release --locked --target "${{ matrix.rust-target }}"
      - name: Verify Linux binary is statically linked
        if: matrix.platform == 'linux'
        run: node scripts/check-static-elf.mjs "${{ matrix.binary }}"
      - uses: docker/setup-qemu-action@v3
        # GitHub-hosted runners have no arm64 binfmt by default; QEMU
        # emulation is required to run the linux/arm64 smoke container.
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
      - name: Smoke test Linux binary on Ubuntu 20.04
        if: matrix.platform == 'linux'
        env:
          DSH_TUI_SMOKE_PLATFORM: ${{ matrix.smoke-platform }}
        run: node scripts/smoke-old-linux.mjs "${{ matrix.binary }}"
      - name: Stage native binary
        run: >-
          node scripts/package-native.mjs stage
          --source "${{ matrix.binary }}"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --vendor-root staged
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.name }}
          path: staged
          if-no-files-found: error

  package:
    name: Assemble npm package
    needs: [test, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: npm/vendor
          merge-multiple: true
      - name: Restore executable permissions
        run: chmod +x npm/vendor/darwin-arm64/dsh-tui npm/vendor/darwin-x64/dsh-tui npm/vendor/linux-x64/dsh-tui npm/vendor/linux-arm64/dsh-tui
      - run: node scripts/package-native.mjs verify --vendor-root npm/vendor
      - name: Pack npm packages
        run: |
          mkdir -p dist
          npm pack ./npm --pack-destination dist
          node scripts/package-alias.mjs npm npm-martty martty
          npm pack ./npm-martty --pack-destination dist
      - uses: actions/upload-artifact@v7
        with:
          name: martty-npm-packages
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish npm
    # Only the canonical repo may publish: the fork shares the same npm
    # package name, and a v* tag pushed there would otherwise ship the
    # fork's build as @latest on npm.
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'openma-ai/Martty'
    needs: package
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.15.0
      - uses: actions/download-artifact@v8
        with:
          name: martty-npm-packages
          path: dist
      - name: Publish npm packages
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            *-alpha.*|*-beta.*|*-rc.*) DIST_TAG=beta ;;
            *) DIST_TAG=latest ;;
          esac
          echo "publishing with dist-tag: $DIST_TAG"
          npm publish ./dist/martty-[0-9]*.tgz --access public --tag "$DIST_TAG" --provenance
          npm publish ./dist/openma-deepseek-harness-tui-[0-9]*.tgz --access public --tag "$DIST_TAG" --provenance

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'openma-ai/Martty'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: martty-npm-packages
          path: dist
      - name: Create GitHub release
        shell: bash
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" ./dist/*.tgz --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
