[package]
name = "deepseek-harness-tui"
version = "0.2.18-beta.1"
edition = "2021"
description = "Terminal-native ACP client UI with a Cordis client plugin tree"
license = "MIT"

[[bin]]
name = "dsh-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
signal-hook = "0.3"
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ruzstd = "0.8"
unicode-width = "0.2"
tui-markdown = { version = "0.3.9", default-features = false }
agent-client-protocol = { version = "2.0.0", features = ["unstable_auth_methods", "unstable_elicitation", "unstable_end_turn_token_usage"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "fs", "net", "time", "sync"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
futures = "0.3.34"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = true
strip = true
