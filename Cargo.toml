[package]
name = "deepseek-harness-tui"
version = "0.1.0"
edition = "2021"
description = "DeepSeek Build (dsh-tui) — a grok-build style TUI speaking the deepseek-harness JSON-RPC stdio protocol"
license = "MIT"

[[bin]]
name = "dsh-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
